# ─────────────────────────────────────────────────────────────────────────────
# Main tmux configuration
# ─────────────────────────────────────────────────────────────────────────────

# Prefix key: Ctrl + f
unbind C-b
set -g prefix C-f

# Quick config reload
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config!"
bind R source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config!"

# Base index (1-based for windows & panes)
set -g base-index 1
setw -g pane-base-index 1
bind : command-prompt

# Sensible defaults
set -g history-limit 500000
set -g display-time 2000
set -sg escape-time 50
set -g repeat-time 200
set-option -g default-terminal "screen-256color"

# Pane zoom & synchronize
bind -n M-z resize-pane -Z
bind X set-window-option synchronize-panes \; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# Resize panes with prefix + Ctrl-arrows
bind -r C-Up    resize-pane -U 5
bind -r C-Down  resize-pane -D 5
bind -r C-Left  resize-pane -L 5
bind -r C-Right resize-pane -R 5

# ── Feature Modules ──────────────────────────────────────────────────────────
# Easily add or drop features by commenting / uncommenting lines below:
source-file -F "#{d:current_file}/conf.d/navigation.conf"
source-file -F "#{d:current_file}/conf.d/splits.conf"
source-file -F "#{d:current_file}/conf.d/rename.conf"
source-file -F "#{d:current_file}/conf.d/scrolling.conf"
source-file -F "#{d:current_file}/conf.d/focus.conf"
source-file -F "#{d:current_file}/conf.d/mouse.conf"
source-file -F "#{d:current_file}/conf.d/status.conf"
source-file -F "#{d:current_file}/conf.d/resurrect.conf"

# Drop-in extension support: any extra *.conf in conf.d/ is automatically loaded
# source-file -F -q "#{d:current_file}/conf.d/custom-*.conf"

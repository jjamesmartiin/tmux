# ── Active Pane Focus & Borders ──────────────────────────────────────────────

# Heavy borders and active indicators
set -g pane-border-lines heavy
set -g pane-border-style fg=colour238
set -g pane-active-border-style "fg=yellow,bold"
set -g pane-border-indicators both

# Top status banner highlighting the active pane
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[bold]#[fg=black]#[bg=yellow] FOCUS #[default] #[bold]#P: #{pane_current_command}#[default],#[fg=colour244]#P: #{pane_current_command}} "

# Preserve natural terminal colors
set -g window-style default
set -g window-active-style default

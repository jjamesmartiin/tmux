# ── Mouse & Thumb Button Navigation ──────────────────────────────────────────

# Enable mouse mode (drag to resize, click to select, wheel scroll)
set -g mouse on

# Mouse Back/Forward thumb buttons (8 & 9) to switch windows/tabs
bind-key -n MouseDown8Pane previous-window
bind-key -n MouseDown9Pane next-window
bind-key -n MouseDown8Status previous-window
bind-key -n MouseDown9Status next-window
bind-key -n MouseDown8Border previous-window
bind-key -n MouseDown9Border next-window
bind-key -T copy-mode-vi MouseDown8Pane previous-window
bind-key -T copy-mode-vi MouseDown9Pane next-window

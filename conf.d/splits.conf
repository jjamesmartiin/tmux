# ── Window Splits & Creation ─────────────────────────────────────────────────

# Path-aware new windows (inherits session directory)
bind-key -n M-c new-window -c "#{?session_path,#{session_path},~}"
bind-key -n M-n new-window -c "#{?session_path,#{session_path},~}"
bind-key -n M-N command-prompt -p "Name of new window: " "new-window -c '#{?session_path,#{session_path},~}' -n '%%'"
bind-key -n M-w kill-pane

# Alt-based split shortcuts (path-aware)
# Alt+i: Vertical split (side-by-side)
# Alt+u / Alt+o: Horizontal split (stacked / top-bottom)
bind-key -n M-i split-window -h -c "#{?@default_path,#{@default_path},#{pane_current_path}}"
bind-key -n M-u split-window -v -c "#{?@default_path,#{@default_path},#{pane_current_path}}"
bind-key -n M-o split-window -v -c "#{?@default_path,#{@default_path},#{pane_current_path}}"

# Visual fallbacks with prefix
bind |  split-window -h -c "#{?@default_path,#{@default_path},#{pane_current_path}}"
bind \\ split-window -h -c "#{?@default_path,#{@default_path},#{pane_current_path}}"
bind -  split-window -v -c "#{?@default_path,#{@default_path},#{pane_current_path}}"
bind _  split-window -v -c "#{?@default_path,#{@default_path},#{pane_current_path}}"

# Equalize / balance pane sizes
bind = select-layout -E

# Mark & swap panes
bind -n M-m select-pane -m
bind -n M-s choose-session
bind -n M-, swap-pane
bind-key -T prefix '<' swap-pane -U
bind-key -T prefix '>' swap-pane -D

# ── Window Renaming ──────────────────────────────────────────────────────────

# Auto-rename windows based on window directory & active command
set -g automatic-rename on
set -g automatic-rename-format "#{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},#{?@default_path,#{b:@default_path},#{b:pane_current_path}},#{?@default_path,#{b:@default_path},#{b:pane_current_path}}:#{pane_current_command}}"

# Manual rename prompts
bind -n M-r command-prompt -p "Rename window:" "rename-window '%%'"
bind-key -n M-R command-prompt -I "" "rename-session '%%'"

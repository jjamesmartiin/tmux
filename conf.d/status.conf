# ── Status Bar & Host Styling ────────────────────────────────────────────────

set-option -g status-position bottom
set-option -g status-interval 5
set -g status-right "#(date +'%y%m%d - %H:%M')"
set-window-option -g window-status-current-style bg=yellow

# Default status bar style
set-option -g status-style bg=green,fg=black

# Host-specific styling
if-shell '[ "$(hostname)" = "pc-jamesm2" ]' \
  'set-option -g status-style bg=red,fg=black'

if-shell '[ "$(hostname)" = "home-jamesm5" ]' \
  'set-option -g status-style bg=blue,fg=black'

# WSL styling
if-shell "uname -r | grep -qi microsoft" \
  "set-option -g status-style bg=magenta,fg=black"

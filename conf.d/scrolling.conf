# ── Scrolling & Copy Mode ────────────────────────────────────────────────────

# Vi mode keys in copy mode
setw -g mode-keys vi

# Copy mode invocation
bind-key v copy-mode
bind-key -n M-v copy-mode

# Smooth line-by-line keyboard scrolling
bind-key -n C-Up copy-mode \; send-keys -X scroll-up
bind-key -T copy-mode-vi C-Up send-keys -X scroll-up
bind-key -T copy-mode-vi C-Down send-keys -X scroll-down-and-cancel

# Selection and copying in copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
set -g set-clipboard on

# ── Session Persistence (tmux-resurrect) ─────────────────────────────────────
# Save: <prefix> Ctrl-s  |  Restore: <prefix> Ctrl-r

run-shell "resurrect_plugin=\$(find /nix/store -maxdepth 2 -name '*tmuxplugin-resurrect*' 2>/dev/null | tail -n 1)/share/tmux-plugins/resurrect/resurrect.tmux; [ -f \"\$resurrect_plugin\" ] && tmux run-shell \"\$resurrect_plugin\""
